<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Doctor Appointment</title>

  <style>
    /* Global reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: url('https://images.unsplash.com/photo-1587502537745-84b34f52e8a4?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
      min-height: 100vh;
      position: relative;
    }

    /* Fixed Navigation Bar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 90, 160, 0.9);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 40px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      z-index: 100;
    }

    nav .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
    }

    nav h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      transition: color 0.3s, border-bottom 0.3s;
    }

    nav ul li a:hover {
      color: #FFEB3B;
      border-bottom: 2px solid #FFEB3B;
      padding-bottom: 4px;
    }

    /* Landing Page Section */
    .landing {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
      color: white;
      padding-top: 80px; /* Space for fixed navbar */
    }

    .landing h2 {
      font-size: 2.5rem;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
    }

    .landing p {
      margin-top: 15px;
      font-size: 1.1rem;
      max-width: 600px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.5);
    }

    /* Login Form Box */
    .login-box {
      position: absolute;
      right: 8%;
      top: 30%;
      background: rgba(255, 255, 255, 0.95);
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 300px;
      text-align: center;
    }

    .login-box h3 {
      margin-bottom: 15px;
      color: #005AA0;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .login-box input:focus {
      border-color: #005AA0;
      box-shadow: 0 0 10px rgba(0, 90, 160, 0.3);
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #005AA0;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.3s ease;
    }

    .login-box button:hover {
      background: #007BFF;
    }

    .login-box a {
      text-decoration: none;
      font-size: 0.9rem;
      display: block;
      margin-top: 10px;
      color: #005AA0;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-box {
        position: static;
        margin: 20px auto;
        width: 80%;
      }

      .landing h2 {
        font-size: 2rem;
      }

      .landing p {
        font-size: 1rem;
        padding: 0 20px;
      }

      nav {
        flex-direction: column;
        gap: 10px;
      }

      nav ul {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation Bar -->
  <nav>
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png" alt="Doctor Logo">
      <h1>HealthConnect</h1>
    </div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Doctors</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Landing Section -->
  <section class="landing">
    <h2>Your Health, Our Priority</h2>
    <p>Book doctor appointments online anytime, anywhere. Trusted specialists, secure system, and personalized healthcare — all at your fingertips.</p>
  </section>

  <!-- Login Form -->
  <div class="login-box">
    <h3>Login</h3>
    <form>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <a href="#">Forgot Password?</a>
    </form>
  </div>

  <script>
    // Simple form feedback
    document.querySelector("form").addEventListener("submit", function(e){
      e.preventDefault();
      alert("Login Successful! (Demo)");
    });
  </script>
</body>
</html>
